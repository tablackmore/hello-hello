<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520"
     font-family="'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="p60d2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A94A3A"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#FFFFFF"/>
  <!-- axes -->
  <path d="M110,50 L110,450 L740,450" fill="none" stroke="#1E2B37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="425" y="484" text-anchor="middle" font-size="16" font-weight="600" fill="#1E2B37">Time</text>
  <!-- food: arithmetic growth, a straight line (h = 60 + 22 per step) -->
  <line x1="130" y1="398" x2="730" y2="158" stroke="#1E2B37" stroke-width="3" stroke-linecap="round"/>
  <!-- population: geometric growth, x1.4 per equal time step (h = 18 x 1.4^n) -->
  <g fill="#4A7FA7" stroke="#1E2B37" stroke-width="1.5">
    <circle cx="150" cy="432" r="10"/>
    <circle cx="205" cy="425" r="10"/>
    <circle cx="260" cy="415" r="10"/>
    <circle cx="315" cy="401" r="10"/>
    <circle cx="370" cy="381" r="10"/>
    <circle cx="425" cy="353" r="10"/>
    <circle cx="480" cy="314" r="10"/>
    <circle cx="535" cy="260" r="10"/>
    <circle cx="590" cy="184" r="10"/>
    <circle cx="645" cy="78" r="10"/>
  </g>
  <!-- labels -->
  <text x="140" y="72" font-size="16" font-weight="600" fill="#1E2B37">Population</text>
  <text x="140" y="136" font-size="16" font-weight="600" fill="#1E2B37">Food</text>
  <g fill="none" stroke="#A94A3A" stroke-width="3" stroke-linecap="round" marker-end="url(#p60d2-arrow)">
    <path d="M238,72 L624,78"/>
    <path d="M190,148 L199,355"/>
    <path d="M618,290 L572,238"/>
  </g>
  <text x="604" y="314" font-size="16" font-weight="600" fill="#1E2B37">Control point</text>
  <g font-size="14" fill="#6B7785">
    <text x="620" y="338">War</text>
    <text x="620" y="360">Famine</text>
    <text x="620" y="382">Pestilence</text>
  </g>
</svg>
